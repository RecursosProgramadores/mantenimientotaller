<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MantePro — Gestión de Mantenimiento Industrial</title>
    <meta name="description" content="Sistema profesional de gestión de mantenimiento industrial: máquinas, mantenimientos, talleres y reportes." />
    <script>
      // Restaura la ruta real que 404.html codificó en la query string (ver
      // ese archivo en /public). El sitio se publica en GitHub Pages, que no
      // puede reescribir rutas del lado del servidor: sin esto, entrar
      // directo a una URL interna (ej. /mantenimientotaller/maquinas) o
      // refrescar la página mostraría un 404 en vez de la app. Debe correr
      // ANTES de que arranque el router.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mantepro-theme');
          var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
